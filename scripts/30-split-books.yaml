# Разделение Даниила: parsed78 -> parsed81
# Все диапазоны стихов — в ПЕЧАТНОЙ 
# Читает scripts/30-split-books.pl (цель `make dat81`).

source_dir: parsed78
target_dir: parsed81

splits:
  - from: 35-daniel.dat
    extract:
      - file: 36-songofthethree.dat
        # Дан 3:24-90 -> одна глава, стихи 1-67 (3:24 -> 1:1 ... 3:90 -> 1:67)
        range: 
          chapter_from: 3
          verse_from: 24
          chapter_to: 3
          verse_to: 90
        renumber:
          chapter: 1
          first_verse: 1
        strip_wrapping_brackets: true
        eng: Song of the Three
        rus: Молитва Азарии
        rus_long: Молитва Азарии и песнь трёх отроков
        testament: DE
        chapters: 1
      - file: 37-susanna.dat
        # Дан 13 глава целиком
        range:
          chapter_from: 13
          chapter_to: 13
        renumber:
          chapter: 1
        strip_wrapping_brackets: true
        eng: Susanna
        rus: Сусанна
        testament: DE
        chapters: 1
      - file: 38-belandthedragon.dat
        # Дан 14 глава целиком
        range:
          chapter_from: 14
          chapter_to: 14
        renumber:
          chapter: 1
        strip_wrapping_brackets: true
        eng: Bel and the Dragon
        rus: Вил и дракон
        testament: DE
        chapters: 1
    keep:
      # остаток Даниила: главы 1-12, глава 3 = 1-23 + бывшие 91-100 как 24-33
      renumber:
        - chapter: 3
          verse_from: 91
          verse_to: 100
          to_first_verse: 24

# 36-hosea.dat -> 39-hosea.dat ... 78-revelation.dat -> 81-revelation.dat.
insert_after: 35