2esdras:
  T:
    - "mt2 Третья книга"
    - "mt1 Ездры"
  Desc: "Книги этой нет ни на еврейском, ни на греческом языках. Как славянский, так и русский переводы сделаны с Вульгаты. В последней она разделена на две книги: первую составляют главы III-XIV по славянскому переводу, а вторая заключает в себе главы I, II, XV и XVI. В русском переводе удержанпорядок глав славянского перевода."
  DescMP: "Книги этой нет ни на еврейском, ни на греческом языках. Как славянский, так и русский переводы сделаны с Вульгаты. В последней она разделена на две книги: первую составляют главы 3-14 по славянскому переводу, а вторая заключает в себя главы 1, 2, 15 и 16. В русском переводе удержан порядок глав славянского перевода."
  DescRBS: "Книги этой нет ни на еврейском, ни на греческом языках. Как славянский, так и русский переводы сделаны с Вульгаты. В последней она разделена на две книги: первую составляют главы III-XIV по славянскому переводу, а вторая заключает в себе главы I, II, XV и XVI. В русском переводе удержанпорядок глав славянского перевода."
