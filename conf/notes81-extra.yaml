# Дополнительные примечания состава rst81 — структурные, а не из печатных
# изданий: они объясняют, где текст стоял в печатном издании, откуда книга
# взялась и куда переехала.
#
# Файл необязателен: генератор подхватывает conf/notes{СОСТАВ}-extra.yaml, если
# он есть, и накладывает поверх conf/paper-notes.yaml. Для 78 и 66 таких файлов
# сейчас нет.
#
# Запись — сноска или список сносок к стиху: text — текст сноски (маркер \f),
# xt — цели перекрёстной ссылки (маркер \x, коды USFM), pos: start — сноска
# ставится в начало стиха, а не в конец. Ссылка ставится только туда, где цель
# существует в этом же составе: у Сусанны и Вила печатный адрес (главы 13–14
# Даниила) в составе отсутствует, поэтому их xt ведут к DAN 12 — месту, откуда
# на них стоит прямая сноска.

books:
  daniel:
    "3":
      "23":
        text: >-
          В печатном издании здесь следуют стихи 24–90, переведённые с
          греческого; в еврейском тексте их нет. Они вынесены в отдельную книгу.
        xt: [S3Y 1]
    "12":
      "13":
        text: >-
          В печатном издании далее следуют главы 13 и 14, переведённые с
          греческого; в еврейском тексте их нет. Они вынесены в отдельные книги.
        xt: [SUS 1, BEL 1]

  songofthethree:
    "1":
      "1":
        - text: Переведено с греческого, в еврейском тексте этого нет.
          pos: start
        - text: В печатном издании — Даниил 3:24–90.
          xt: [DAN 3]
          pos: start

  susanna:
    "1":
      "1":
        - text: Переведена с греческого, в еврейском тексте её нет.
          pos: start
        - text: В печатном издании — 13-я глава Даниила.
          xt: [DAN 12]
          pos: start

  belandthedragon:
    "1":
      "1":
        - text: Переведена с греческого, в еврейском тексте её нет.
          pos: start
        - text: В печатном издании — 14-я глава Даниила.
          xt: [DAN 12]
          pos: start

  2chronicles:
    "36":
      "23":
        text: В печатном издании далее помещается Молитва Манассии.
        xt: [MAN 1]

  prayerofmanasseh:
    "1":
      "1":
        text: В печатном издании помещается в конце 2 Паралипоменон.
        xt: [2CH 36]
