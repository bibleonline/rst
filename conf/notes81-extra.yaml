# Дополнительные примечания состава rst81 — структурные, а не из печатных
# изданий: они объясняют, где текст стоял в печатном издании, откуда книга
# взялась и куда переехала.
#
# Файл необязателен: генератор подхватывает conf/notes{СОСТАВ}-extra.yaml, если
# он есть, и накладывает поверх conf/paper-notes.yaml. Для 78 и 66 таких файлов
# сейчас нет.
#
# Запись — сноска или список сносок к стиху: text — текст сноски (маркер \f),
# xt — цели перекрёстной ссылки, pos: start — сноска ставится в начало стиха,
# а не в конец. Ссылки идут внутрь той же сноски (маркер \xt), сразу за text:
# это одно высказывание, и отдельным \x потребитель нарисовал бы вторую сноску
# рядом с первой. Поэтому text подводит к ссылке и точкой не закрывается.
#
# Ссылка ставится только туда, где цель существует в этом же составе: печатный
# адрес Сусанны и Вила (главы 13–14 Даниила) в составе отсутствует, поэтому их
# xt ведут к книге Даниила целиком, а не к главе, которой нет.
#
# Цель — «КОД» или «КОД глава». Без номера главы это книга целиком: адрес ведёт
# на корень книги. Так записаны односоставные S3Y, SUS, BEL, MAN, где номер «1»
# был бы шумом, и DAN там, где нужной главы в составе нет.
#
# Видимый текст ссылки генератор берёт из conf/booknames.yaml: name для цели
# без главы («Сусанна»), abbr рядом с номером («Дан 12»). Если сноска называет
# адрес своими словами, цель пишется как { loc: КОД глава, text: свой текст } —
# иначе подставленный титул оборвал бы фразу.

books:
  daniel:
    "3":
      "23":
        text: >-
          В печатном издании здесь следуют стихи 24–90, переведённые с
          греческого; в еврейском тексте их нет. Они вынесены в отдельную книгу:
        xt: [S3Y]
    "12":
      "13":
        text: >-
          В печатном издании далее следуют главы 13 и 14, переведённые с
          греческого; в еврейском тексте их нет. Они вынесены в отдельные книги:
        xt: [SUS, BEL]

  songofthethree:
    "1":
      "1":
        - text: Переведено с греческого, в еврейском тексте этого нет.
          pos: start
        - text: В печатном издании —
          xt: [{ loc: DAN 3, text: Даниил 3:24–90 }]
          pos: start

  susanna:
    "1":
      "1":
        - text: Переведена с греческого, в еврейском тексте её нет.
          pos: start
        - text: В печатном издании — 13-я глава книги
          xt: [{ loc: DAN, text: Даниила }]
          pos: start

  belandthedragon:
    "1":
      "1":
        - text: Переведена с греческого, в еврейском тексте её нет.
          pos: start
        - text: В печатном издании — 14-я глава книги
          xt: [{ loc: DAN, text: Даниила }]
          pos: start

  2chronicles:
    "36":
      "23":
        text: В печатном издании далее помещается
        xt: [MAN]

  prayerofmanasseh:
    "1":
      "1":
        text: В печатном издании помещается в конце книги
        xt: [{ loc: 2CH 36, text: 2 Паралипоменон }]
