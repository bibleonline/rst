copy:
  Desc: "Проект Библия Онлайн, 2017, 2024 only.bible. Набор и сверка с бумажных экземпляров"
  prefix:
    MP: "Московской Патриархии Русской Православной Церкви"
    RBS: "Российское Библейское общество"

# Именованные наборы изданий. В маркерах примечаний работает алгебра:
#   A+B — объединение;  X-Y — «все из X, кроме Y».
# Примеры: AL-MP — все издания, кроме изданий МП; AL-MP1976 — все, кроме MP1976.
sets:
  MP:    { expr: MP1976+MP2016+MPNT, note: "для книг ВЗ не включая MPNT" }
  RBS:   { expr: RBS77+RBS66+RBS41,  note: "для второканонических книг не включён RBSPR" }
  RBSPR: { expr: RBS66+RBS41,        note: "протестантские издания РБО" }
  AL:    { expr: BL+MP+RBS,          note: "для второканонических книг не включён RBS66 + BL" }
  PR:    { expr: RBSPR+BL,           note: "протестантские издания" }
  OR:    { expr: MP+RBS77,           note: "издания из 77 книг" }

