job:
  chapters:
    "2":
      "9":
        - { for: MP, anchor: "умри", text: "Этот стих по переводу 70-ти: По многом времени сказала ему жена его: доколе ты будешь терпеть? Вот, подожду еще немного в надежде спасения моего. Ибо погибли с земли память твоя, сыновья и дочери, болезни чрева моего и труды, которыми напрасно трудилась. Сам ты сидишь в смраде червей, проводя ночь без покрова, а я скитаюсь и служу, перехожу с места на место, из дома в дом, ожидая, когда зайдет солнце, чтобы успокоиться от трудов моих и болезней, которые ныне удручают меня. Но скажи некое слово к Богу и умри." }
        - { for: RBS77, anchor: "умри.", text: "Этот стих по переводу 70-ти: По многом времени сказала ему жена его: доколе ты будешь терпеть? Вот подожду еще немного в надежде спасения моего. Ибо погибла с земли память твоя, сыновья и дочери, болезни чрева моего и труды, которыми напрасно трудилась. Сам ты сидишь в смраде червей, проводя ночь без покрова, а я скитаюсь и служу, перехожу с места на место, из дома в дом, ожидая, когда выйдет солнце, чтобы успокоиться от трудов моих и болезней, которые ныне удручают меня. Но скажи некое слово к Богу и умри." }
        - { skip: PR }
        - { for: SYNOT, anchor: "умри.", text: "Этот стих по переводу 70: По многом времени сказала ему жена его: Доколе ты будешь терпеть? Вот, подожду еще немного в надежде спасения моего. Ибо погибли с земли память твоя, сыновья и дочери, болезни чрева моего и труды, которыми напрасно трудилась. Сам ты сидишь в смраде червей, проводя ночь без покрова; а я скитаюсь и служу, перехожу с места на место, из дома в дом, ожидая, когда зайдет солнце, чтоб успокоиться от трудов моих и болезней, которые ныне удручают меня. Но скажи некое слово к Богу, и умри." }
    "9":
      "9":
        - { for: AL, except: RBS77, anchor: "Хима", text: "Созвездия, соответствующие нынешним названиям: Медведицы, Ориона и Плеяд." }
        - { for: RBS77, anchor: "Хима", text: "Созвездия Медведицы, Ориона и Плеяд." }
        - { for: SYNOT, anchor: "Хима", text: "Созвездия, соответствующие нынешним названиям: Медведицы, Ориона и Плеяд." }
    "42":
      "17":
        - { for: MP, anchor: "днями", text: "В Славянской Библии к книге Иова имеется следующее добавление: «Написано, что он опять восстанет с теми, коих воскресит Господь. О нем толкуется в Сирской книге, что жил он в земле Авситидийской на пределах Идумеи и Аравии: прежде же было имя ему Иовав. Взяв жену Аравитянку, родил сына, которому имя Еннон. Происходил он от отца Зарефа, сынов Исавовых сын, матери же Воссоры, так что был он пятым от Авраама. И сии цари, царствовавшие в Едоме, какою страною и он обладал: первый Валак, сын Веора, и имя городу его Деннава; после же Валака Иовав, называемый Иовом; после сего Ассом, игемон из Феманитской страны; после него Адад, сын Варада, поразивший Мадиама на поле Моава, – и имя городу его Гефем. Пришедшие же к нему друзья, Елифаз (сын Софана) от сынов Исавовых, царь Феманский, Валдад (сын Амнона Ховарского) савхейский властитель, Софар Минейский царь. (Феман сын Елифаза, игемон Идумеи. О нем говорится в книге Сирской, что жил в земле Авситидийской, около берегов Евфрата; прежде имя его было Иовав, отец же его был Зареф, от востока солнца.)»" }
        - { for: RBS77, anchor: "днями.", text: "В Славянской Библии к книге Иова имеется следующее добавление: «Написано, что он опять восстанет с теми, коих воскресит Господь. О нем толкуется в Сирской книге, что жил он в земле Авситидийской на пределах Идумеи и Аравии: прежде же было имя ему Иовав. Взяв жену Аравитянку, родил сына, которому имя Еннон. Происходил он от отца Зарефа, сынов Исавовых сын, матери же Воссоры, так что был он пятым от Авраама. И сии цари, царствовавшие в Эдоме, какою страною и он обладал: первый Валак, сын Веора, и имя городу его Деннава; после же Валака Иовав, называемый Иовом; после сего Ассом, игемон из Феманитской страны; после него Адад, сын Варада, поразивший Мадиама на поле Моава, и имя городу его Гефем. Пришедшие же к нему друзья, Елифаз (сын Софана) от сынов Исавовых, царь Феманский, Валдад (сын Амнона Ховарского) савхейский властитель, Софар Минейский царь. (Феман сын Елифаза, игемон Идумеи. О нем говорится в книге Сирской, что жил в земле Авситидийской, около берегов Евфрата; прежде имя его было Иовав, отец же его был Зареф, от востока солнца.)»." }
