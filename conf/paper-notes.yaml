# Запись: for — издание/набор (список = объединение «+» источника), except —
# исключение («X-Y»); anchor — якорное слово; skip — «в этих изданиях сноски
# нет»; header — примечание к заголовку книги, sheader — к предисловию.
# Источник: paper/notes.conf, Config::General (удалён, история в git).
